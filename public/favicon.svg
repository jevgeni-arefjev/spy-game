<!--
  The die-cut token, at 32px: lid stock, a brass punch ring, and the lozenge
  the card backs are printed with. A standalone SVG cannot read the page's
  custom properties, so this file and `src/assets/card-back.svg` are the only
  two places outside `tokens.css` that carry a hex value.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#241238" />
  <circle cx="16" cy="16" r="12" fill="#1a0d29" />
  <circle cx="16" cy="16" r="12" fill="none" stroke="#e8b34a" stroke-width="2" />
  <path
    d="M16 8.5 L21.5 16 L16 23.5 L10.5 16 Z"
    fill="none"
    stroke="#e8b34a"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <circle cx="16" cy="16" r="2.4" fill="#e8b34a" />
</svg>
