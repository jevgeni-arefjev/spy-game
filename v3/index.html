<!DOCTYPE html>
<html lang="en" data-mode="strip">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spy - v3 Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Doto:wght@100..900&display=swap">
<style>
/* ------------------------------------------------------------------ *
 * v3 "Scoreboard" - seven-segment hardware.
 * Digits are never a font: every numeral is seven clip-path segments
 * in a fixed cell, with unlit segments drawn as ghosts.
 * ------------------------------------------------------------------ */

:root{
  --ground:#0b0b0d;
  --bezel-a:#191919;
  --bezel-b:#101012;
  --panel-a:#111114;
  --panel-b:#08080a;
  --hair:#2b2b31;

  --key-a:#2a2a2e;
  --key-b:#1b1b1f;
  --key-top:#46464e;
  --key-bot:#050506;

  --pkey-a:#33191a;
  --pkey-b:#210f10;
  --pkey-top:#5e2c2c;

  --vinyl:#d7d7d2;
  --vinyl-bright:#ece9e4;
  --vinyl-dim:#a9a9a2;
  --vinyl-faint:#949490;

  --led:#ff3b2f;
  --led-glow:rgba(255,59,47,.6);
  --amber:#ffb000;

  --doto:'Doto','Segoe UI Symbol',ui-monospace,'Courier New',monospace;
  --sans:'Barlow Condensed','Arial Narrow',system-ui,-apple-system,'Segoe UI',sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}

html{background:#e9e9e6}
body{
  margin:0;
  background:#e9e9e6;
  font-family:var(--sans);
  color:#33332f;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
::selection{background:var(--led);color:#0b0b0d}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}

/* ---------- mockup chrome (neutral, not part of the world) ---------- */
.chrome{padding:28px 32px 4px;max-width:1600px;margin:0 auto}
.chrome p{
  margin:0;font-size:14px;letter-spacing:.02em;color:#5a5a55;
  font-weight:500;
}
.chrome b{color:#1e1e1c;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.strip{
  display:flex;flex-wrap:wrap;gap:36px 28px;
  padding:24px 32px 56px;max-width:1600px;margin:0 auto;align-items:flex-start;
}
figure{margin:0;display:flex;flex-direction:column;gap:10px;width:360px}
figcaption{
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#57574f;
  text-align:center;order:2;
}
.rolebar{
  order:0;display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#57574f;
}
.rolebar button{
  font:inherit;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid #c6c6c0;background:#f6f6f4;color:#4a4a45;
  border-radius:4px;padding:4px 9px;cursor:pointer;
}
.rolebar button[aria-pressed="true"]{background:#1e1e1c;border-color:#1e1e1c;color:#f2f2ee}
.rolebar button:focus-visible{outline:2px solid #1e1e1c;outline-offset:2px}
.phone{order:1}

/* ---------- single mode ---------- */
html[data-mode="single"],body[data-mode="single"]{
  margin:0;background:transparent;overflow:hidden;width:360px;height:780px;
}
body[data-mode="single"] .chrome{display:none}
body[data-mode="single"] .strip{display:block;padding:0;margin:0;max-width:none}
body[data-mode="single"] figure{gap:0;width:360px}
body[data-mode="single"] figcaption,
body[data-mode="single"] .rolebar{display:none}
body[data-mode="single"] .phone{border-radius:0;box-shadow:none}

/* ================================================================== *
 * THE WORLD
 * ================================================================== */
.phone{
  position:relative;width:360px;height:780px;overflow:hidden;
  border-radius:6px;
  background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,var(--bezel-a) 0%,var(--bezel-b) 62%,#0c0c0e 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.28);
  color:var(--vinyl);
  font-family:var(--sans);
}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:24px 20px 28px;
}
.phone :focus{outline:none}
.phone :focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}

/* ---------- seven-segment cells ---------- */
.seg{
  --h:40px;
  --w:calc(var(--h) * .58);
  --t:calc(var(--h) * .135);
  --gap:calc(var(--h) * .09);
  --lit:var(--led);
  --ghost:rgba(255,59,47,.10);
  --glow:var(--led-glow);
  --sep:rgba(255,59,47,.34);
  display:inline-flex;align-items:center;vertical-align:middle;line-height:0;
}
.seg[data-tone="amber"]{--lit:var(--amber);--ghost:rgba(255,176,0,.10);--glow:rgba(255,176,0,.5);--sep:rgba(255,176,0,.34)}
.seg[data-tone="standby"]{--lit:rgba(255,59,47,.44);--ghost:rgba(255,59,47,.08);--glow:transparent;--sep:rgba(255,59,47,.22)}
.seg-cells{display:inline-flex;align-items:center;gap:var(--gap)}
.seg-digit{position:relative;display:block;width:var(--w);height:var(--h)}
.seg-digit i{position:absolute;display:block;background:var(--ghost)}
.seg-digit .sa,.seg-digit .sg,.seg-digit .sd{
  left:calc(var(--t) / 2);width:calc(var(--w) - var(--t));height:var(--t);
  clip-path:polygon(calc(var(--t) / 2) 0,calc(100% - var(--t) / 2) 0,100% 50%,calc(100% - var(--t) / 2) 100%,calc(var(--t) / 2) 100%,0 50%);
}
.seg-digit .sb,.seg-digit .sc,.seg-digit .se,.seg-digit .sf{
  width:var(--t);height:calc(var(--h) / 2 - var(--t));
  clip-path:polygon(0 calc(var(--t) / 2),50% 0,100% calc(var(--t) / 2),100% calc(100% - var(--t) / 2),50% 100%,0 calc(100% - var(--t) / 2));
}
.seg-digit .sa{top:0}
.seg-digit .sg{top:calc(50% - var(--t) / 2)}
.seg-digit .sd{bottom:0}
.seg-digit .sf{top:calc(var(--t) / 2);left:0}
.seg-digit .sb{top:calc(var(--t) / 2);right:0}
.seg-digit .se{bottom:calc(var(--t) / 2);left:0}
.seg-digit .sc{bottom:calc(var(--t) / 2);right:0}

.seg-digit[data-d="0"] .sa,.seg-digit[data-d="2"] .sa,.seg-digit[data-d="3"] .sa,.seg-digit[data-d="5"] .sa,.seg-digit[data-d="6"] .sa,.seg-digit[data-d="7"] .sa,.seg-digit[data-d="8"] .sa,.seg-digit[data-d="9"] .sa,
.seg-digit[data-d="0"] .sb,.seg-digit[data-d="1"] .sb,.seg-digit[data-d="2"] .sb,.seg-digit[data-d="3"] .sb,.seg-digit[data-d="4"] .sb,.seg-digit[data-d="7"] .sb,.seg-digit[data-d="8"] .sb,.seg-digit[data-d="9"] .sb,
.seg-digit[data-d="0"] .sc,.seg-digit[data-d="1"] .sc,.seg-digit[data-d="3"] .sc,.seg-digit[data-d="4"] .sc,.seg-digit[data-d="5"] .sc,.seg-digit[data-d="6"] .sc,.seg-digit[data-d="7"] .sc,.seg-digit[data-d="8"] .sc,.seg-digit[data-d="9"] .sc,
.seg-digit[data-d="0"] .sd,.seg-digit[data-d="2"] .sd,.seg-digit[data-d="3"] .sd,.seg-digit[data-d="5"] .sd,.seg-digit[data-d="6"] .sd,.seg-digit[data-d="8"] .sd,.seg-digit[data-d="9"] .sd,
.seg-digit[data-d="0"] .se,.seg-digit[data-d="2"] .se,.seg-digit[data-d="6"] .se,.seg-digit[data-d="8"] .se,
.seg-digit[data-d="0"] .sf,.seg-digit[data-d="4"] .sf,.seg-digit[data-d="5"] .sf,.seg-digit[data-d="6"] .sf,.seg-digit[data-d="8"] .sf,.seg-digit[data-d="9"] .sf,
.seg-digit[data-d="2"] .sg,.seg-digit[data-d="3"] .sg,.seg-digit[data-d="4"] .sg,.seg-digit[data-d="5"] .sg,.seg-digit[data-d="6"] .sg,.seg-digit[data-d="8"] .sg,.seg-digit[data-d="9"] .sg{
  background:var(--lit);
  filter:drop-shadow(0 0 calc(var(--h) * .055) var(--glow));
}
.seg-colon{
  position:relative;display:block;width:calc(var(--h) * .26);height:var(--h);
}
.seg-colon i{
  position:absolute;left:50%;width:var(--t);height:var(--t);margin-left:calc(var(--t) / -2);
  background:var(--lit);border-radius:1px;
  filter:drop-shadow(0 0 calc(var(--h) * .055) var(--glow));
}
.seg-colon i:first-child{top:calc(var(--h) * .30 - var(--t) / 2)}
.seg-colon i:last-child{top:calc(var(--h) * .70 - var(--t) / 2)}
.seg-slash{
  display:block;width:calc(var(--h) * .34);height:var(--h);background:var(--sep);
  clip-path:polygon(calc(100% - var(--t) * .6) 6%,100% 6%,calc(var(--t) * .6) 94%,0 94%);
}
.seg-space{display:block;width:calc(var(--h) * .12);height:var(--h)}

/* ---------- printed vinyl ---------- */
.vinyl{
  font-family:var(--sans);font-weight:600;font-size:12px;line-height:1;
  letter-spacing:.17em;text-transform:uppercase;color:var(--vinyl);
}
.vinyl-sm{font-size:11px;letter-spacing:.16em}
.title{
  margin:0;font-family:var(--doto);font-weight:700;font-size:32px;line-height:1;
  letter-spacing:.02em;text-transform:uppercase;color:var(--vinyl-bright);
}
.sub{
  margin:8px 0 0;font-family:var(--sans);font-weight:400;font-size:15px;line-height:1.34;
  color:var(--vinyl-dim);max-width:31ch;
}
.head{flex:0 0 auto}

/* ---------- recessed display panel ---------- */
.panel{
  position:relative;border-radius:10px;
  background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
  border:1px solid var(--hair);
  box-shadow:inset 0 3px 14px rgba(0,0,0,.92),inset 0 0 0 1px rgba(255,255,255,.018),0 1px 0 rgba(255,255,255,.045);
}
.panel::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    radial-gradient(circle at 9px 9px,#41414a 0 2.2px,#0a0a0c 2.4px 3.4px,transparent 3.6px),
    radial-gradient(circle at calc(100% - 9px) 9px,#41414a 0 2.2px,#0a0a0c 2.4px 3.4px,transparent 3.6px),
    radial-gradient(circle at 9px calc(100% - 9px),#41414a 0 2.2px,#0a0a0c 2.4px 3.4px,transparent 3.6px),
    radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),#41414a 0 2.2px,#0a0a0c 2.4px 3.4px,transparent 3.6px);
}

/* ---------- console keys ---------- */
.key{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  min-height:56px;padding:0 18px;border:1px solid #000;border-radius:9px;
  font:inherit;text-align:left;cursor:pointer;
  background:linear-gradient(180deg,var(--key-a),var(--key-b));
  box-shadow:
    inset 0 1px 0 var(--key-top),
    inset 0 -2px 0 rgba(0,0,0,.55),
    0 3px 0 var(--key-bot),
    0 6px 12px rgba(0,0,0,.55);
  touch-action:manipulation;
}
.key .key-label{
  font-family:var(--sans);font-weight:600;font-size:17px;line-height:1;
  letter-spacing:.15em;text-transform:uppercase;color:var(--vinyl);
}
.key .led{
  flex:0 0 auto;width:9px;height:9px;border-radius:50%;
  background:rgba(255,59,47,.13);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.65),inset 0 1px 1px rgba(255,255,255,.06);
}
.key.on .led{
  background:var(--led);
  box-shadow:0 0 7px rgba(255,59,47,.85),inset 0 0 0 1px rgba(0,0,0,.35);
}
.key:active{
  transform:translateY(3px);
  box-shadow:
    inset 0 1px 0 var(--key-top),
    inset 0 -1px 0 rgba(0,0,0,.55),
    0 0 0 var(--key-bot),
    0 2px 5px rgba(0,0,0,.6);
}
.key-primary{
  min-height:60px;justify-content:center;
  background:linear-gradient(180deg,var(--pkey-a),var(--pkey-b));
  box-shadow:
    inset 0 1px 0 var(--pkey-top),
    inset 0 -2px 0 rgba(0,0,0,.6),
    0 3px 0 #140708,
    0 8px 18px rgba(120,20,16,.30);
}
.key-primary .key-label{color:#fff1ee;font-size:18px}
.key-ghost{
  min-height:48px;justify-content:center;
  background:linear-gradient(180deg,#212125,#161619);
  box-shadow:inset 0 1px 0 #35353c,inset 0 -1px 0 rgba(0,0,0,.5),0 2px 0 #050506,0 4px 9px rgba(0,0,0,.45);
}
.key-ghost .key-label{color:var(--vinyl-dim);font-size:15px;letter-spacing:.16em}
.key[disabled]{
  cursor:default;
  background:linear-gradient(180deg,#1a1a1d,#141417);
  box-shadow:inset 0 1px 0 #2a2a30,inset 0 -1px 0 rgba(0,0,0,.5),0 2px 0 #050506;
  transform:none;
}
.key[disabled] .key-label{color:#80807a}
.key[disabled] .led{background:rgba(255,59,47,.07);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.key-row{display:flex;gap:10px}
.key-row .key{width:auto;flex:1}

/* ================================================================== *
 * HOME
 * ================================================================== */
.powerled{
  position:absolute;top:16px;right:18px;width:6px;height:6px;border-radius:50%;
  background:var(--led);box-shadow:0 0 6px rgba(255,59,47,.8);
}
.home-top{margin-top:56px;text-align:center}
.brand{
  margin:0;font-family:var(--doto);font-weight:800;font-size:112px;line-height:.86;
  letter-spacing:.03em;text-transform:uppercase;color:var(--led);
  filter:drop-shadow(0 0 9px rgba(255,59,47,.42));
}
.tagline{
  margin:18px 0 0;font-family:var(--sans);font-weight:600;font-size:18px;line-height:1;
  letter-spacing:.19em;text-transform:uppercase;color:var(--vinyl);
}
.home-mid{flex:1;display:flex;align-items:center;justify-content:center}
.panel-clock{padding:18px 26px;display:flex;align-items:center;justify-content:center}

/* ================================================================== *
 * TOPICS
 * ================================================================== */
.countplate{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:22px;padding:9px 14px;border-radius:7px;
  background:linear-gradient(180deg,#1d1d21,#141417);
  border:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 rgba(0,0,0,.6);
}
.plates{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:11px}
.plate{
  display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:0 16px;
  font:inherit;text-align:left;cursor:pointer;border:1px solid #000;border-radius:8px;
  background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#232327,#17171b);
  box-shadow:inset 0 1px 0 #3b3b43,inset 0 -1px 0 rgba(0,0,0,.6),0 2px 0 #060607,0 4px 9px rgba(0,0,0,.4);
  touch-action:manipulation;
}
.plate .led{
  flex:0 0 auto;width:10px;height:10px;border-radius:50%;
  background:rgba(255,59,47,.11);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.7);
}
.plate[aria-pressed="true"] .led{
  background:var(--led);box-shadow:0 0 8px rgba(255,59,47,.85),inset 0 0 0 1px rgba(0,0,0,.35);
}
.plate-label{
  font-family:var(--sans);font-weight:600;font-size:17px;line-height:1;
  letter-spacing:.13em;text-transform:uppercase;color:var(--vinyl-faint);
}
.plate[aria-pressed="true"] .plate-label{color:var(--vinyl-bright)}
.plate:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #3b3b43,0 0 0 #060607,0 2px 5px rgba(0,0,0,.4)}
.plate[disabled]{cursor:default}
.plate[disabled]:active{transform:none;box-shadow:inset 0 1px 0 #3b3b43,inset 0 -1px 0 rgba(0,0,0,.6),0 2px 0 #060607,0 4px 9px rgba(0,0,0,.4)}
.keys{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:9px}

/* ================================================================== *
 * PLAYERS
 * ================================================================== */
.addrow{display:flex;gap:9px;margin-top:14px}
.slot{
  flex:1;min-width:0;min-height:50px;padding:0 14px;border-radius:7px;
  border:1px solid #000;
  background:linear-gradient(180deg,#08080a,#0e0e11);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.04);
  font-family:var(--doto);font-weight:600;font-size:18px;letter-spacing:.02em;
  color:var(--vinyl-bright);caret-color:var(--led);
}
.slot::placeholder{color:#83837d;font-family:var(--sans);font-weight:400;font-size:16px;letter-spacing:.04em}
.slot:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.key-add{width:auto;min-height:50px;padding:0 16px;flex:0 0 auto;justify-content:center}
.key-add .key-label{font-size:15px}
.errline{
  min-height:18px;margin:6px 0 0;
  font-family:var(--sans);font-weight:600;font-size:13px;line-height:18px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--led);
}
.stepper{
  display:flex;align-items:center;gap:12px;margin-top:4px;padding:8px 14px;border-radius:7px;
  background:linear-gradient(180deg,#1d1d21,#141417);border:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 rgba(0,0,0,.6);
}
.stepper .vinyl{margin-right:auto}
.step-btn{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;padding:0;border:1px solid #000;border-radius:7px;cursor:pointer;
  background:linear-gradient(180deg,var(--key-a),var(--key-b));
  box-shadow:inset 0 1px 0 var(--key-top),inset 0 -1px 0 rgba(0,0,0,.55),0 2px 0 var(--key-bot),0 4px 8px rgba(0,0,0,.45);
  color:var(--vinyl);
}
.step-btn svg{display:block}
.step-btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--key-top),0 0 0 var(--key-bot),0 2px 4px rgba(0,0,0,.45)}
.step-btn[disabled]{cursor:default;color:#6e6e67;background:linear-gradient(180deg,#1a1a1d,#141417);box-shadow:inset 0 1px 0 #2a2a30,0 2px 0 #050506}
.step-btn[disabled]:active{transform:none}
.step-value{
  display:flex;align-items:center;justify-content:center;width:34px;
}
.rosterhead{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:16px;padding:0 2px 8px;border-bottom:1px solid #26262b;
}
.roster{
  list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:#3a3a42 #0d0d10;
}
.roster::-webkit-scrollbar{width:6px}
.roster::-webkit-scrollbar-track{background:#0d0d10;border-radius:3px}
.roster::-webkit-scrollbar-thumb{background:#3a3a42;border-radius:3px}
.roster li{
  display:flex;align-items:center;gap:12px;min-height:46px;
  border-bottom:1px solid #1c1c20;padding-right:2px;
}
.roster li:last-child{border-bottom:none}
.roster li .idx{flex:0 0 auto;width:22px;display:flex;justify-content:flex-end}
.pname{
  flex:1;min-width:0;font-family:var(--doto);font-weight:600;font-size:19px;line-height:1.1;
  letter-spacing:.02em;color:var(--vinyl-bright);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.rm{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;padding:0;border:0;background:none;cursor:pointer;color:#83837d;
}
.rm:hover{color:var(--led)}
.rm svg{display:block}
.empty{
  padding:22px 2px;font-family:var(--sans);font-size:15px;color:var(--vinyl-dim);
}
.hintline{
  min-height:20px;margin:10px 0 0;
  font-family:var(--sans);font-weight:400;font-size:15px;line-height:20px;color:var(--vinyl-dim);
}

/* ================================================================== *
 * HANDOFF / CARD
 * ================================================================== */
.cue{margin:0;display:flex;align-items:center;gap:8px}
.cue .vinyl{color:var(--vinyl-faint)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.panel-msg{
  width:100%;padding:48px 22px;display:flex;align-items:center;justify-content:center;
}
.bigword{
  margin:0;font-family:var(--doto);font-weight:700;font-size:30px;line-height:1.24;
  letter-spacing:.01em;color:var(--vinyl-bright);text-align:center;
}
.handoff-keys{margin-top:20px}

.card-wrap{flex:1;min-height:0;display:flex;align-items:center}
.cardbtn{
  position:relative;height:452px;width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:26px 20px;border-radius:10px;cursor:pointer;font:inherit;
  border:1px solid var(--hair);
  background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
  box-shadow:inset 0 3px 14px rgba(0,0,0,.92),inset 0 0 0 1px rgba(255,255,255,.018),0 1px 0 rgba(255,255,255,.045);
  touch-action:manipulation;
}
.cardbtn::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    radial-gradient(circle at 9px 9px,#41414a 0 2.2px,#0a0a0c 2.4px 3.4px,transparent 3.6px),
    radial-gradient(circle at calc(100% - 9px) 9px,#41414a 0 2.2px,#0a0a0c 2.4px 3.4px,transparent 3.6px),
    radial-gradient(circle at 9px calc(100% - 9px),#41414a 0 2.2px,#0a0a0c 2.4px 3.4px,transparent 3.6px),
    radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),#41414a 0 2.2px,#0a0a0c 2.4px 3.4px,transparent 3.6px);
}
.cardbtn[data-face="back"]{cursor:pointer}
.cardbtn > span{display:flex;flex-direction:column;align-items:center;gap:18px}
.card-name{
  font-family:var(--doto);font-weight:700;font-size:40px;line-height:1;letter-spacing:.02em;
  color:var(--vinyl-bright);
}
.card-cta{
  font-family:var(--sans);font-weight:600;font-size:13px;line-height:1;
  letter-spacing:.19em;text-transform:uppercase;color:var(--vinyl-dim);
}
.word{
  font-family:var(--doto);font-weight:800;font-size:40px;line-height:1.06;letter-spacing:.01em;
  text-align:center;color:var(--amber);
  filter:drop-shadow(0 0 8px rgba(255,176,0,.34));
}
.word-red{color:var(--led);filter:drop-shadow(0 0 8px rgba(255,59,47,.38))}
.spy-title{
  font-family:var(--doto);font-weight:700;font-size:26px;line-height:1.1;letter-spacing:.02em;
  text-align:center;color:var(--led);filter:drop-shadow(0 0 7px rgba(255,59,47,.35));
}
.alarm{
  position:absolute;top:17px;right:24px;width:9px;height:9px;border-radius:50%;
  background:var(--led);box-shadow:0 0 8px rgba(255,59,47,.9);
  animation:blink 1s steps(1,end) infinite;
}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:.06}}
.cardhint{
  min-height:22px;margin:16px 0 0;text-align:center;
  font-family:var(--sans);font-weight:500;font-size:12px;line-height:22px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--vinyl-faint);
}

/* ================================================================== *
 * DISCUSSION / ENDED
 * ================================================================== */
.stage-col{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:24px}
.clockpanel{
  padding:16px 14px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;
}
.clockpanel .vinyl{align-self:flex-start;margin-left:6px}
.disc-hint{
  margin:0;font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.35;
  color:var(--vinyl-dim);max-width:30ch;
}
.ended-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.ended-title{
  margin:0;font-family:var(--doto);font-weight:800;font-size:50px;line-height:1;
  letter-spacing:.02em;text-transform:uppercase;text-align:center;color:var(--led);
  filter:drop-shadow(0 0 10px rgba(255,59,47,.4));
}
.ended-sub{
  margin:0;text-align:center;font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.35;
  color:var(--vinyl-dim);max-width:28ch;
}

@media (prefers-reduced-motion: reduce){
  .alarm{animation:none}
  .blink-set .seg-cells{animation:none}
}
.blink-set .seg-cells{animation:setblink 1s steps(1,end)}
@keyframes setblink{0%,100%{opacity:1}25%,75%{opacity:.12}}
</style>

<body data-mode="strip">

<header class="chrome">
  <p><b>v3 Scoreboard</b> &nbsp;/&nbsp; seven-segment hardware: the phone reads like a gym scoreboard, and the unlit cells are designed too.</p>
</header>

<div class="strip">

  <!-- ============================ HOME ============================ -->
  <figure>
    <section class="phone" data-screen="home">
      <div class="screen">
        <span class="powerled" aria-hidden="true"></span>
        <div class="home-top">
          <h1 class="brand">Spy</h1>
          <p class="tagline">One phone. One spy.</p>
        </div>
        <div class="home-mid">
          <div class="panel panel-clock">
            <span class="seg" data-seg="05:00" data-tone="standby" style="--h:52px"></span>
          </div>
        </div>
        <button type="button" class="key key-primary on">
          <span class="led" aria-hidden="true"></span>
          <span class="key-label">Play Spy</span>
        </button>
      </div>
    </section>
    <figcaption>Home</figcaption>
  </figure>

  <!-- =========================== TOPICS =========================== -->
  <figure>
    <section class="phone" data-screen="topics">
      <div class="screen">
        <div class="head">
          <h1 class="title">Topics</h1>
          <p class="sub">Pick which sets of words can come up. Keep at least one.</p>
        </div>
        <div class="countplate">
          <span class="vinyl">Included</span>
          <span class="seg" id="topic-count" data-seg="3 / 5" style="--h:24px"></span>
        </div>
        <ul class="plates" id="plates"></ul>
        <div class="keys">
          <button type="button" class="key key-primary on">
            <span class="led" aria-hidden="true"></span>
            <span class="key-label">Continue</span>
          </button>
          <button type="button" class="key key-ghost"><span class="key-label">Back</span></button>
        </div>
      </div>
    </section>
    <figcaption>Topics</figcaption>
  </figure>

  <!-- ========================== PLAYERS =========================== -->
  <figure>
    <section class="phone" data-screen="players">
      <div class="screen">
        <div class="head">
          <h1 class="title">Players</h1>
          <p class="sub">Pass the phone around. One of you is the spy.</p>
        </div>

        <div class="addrow">
          <label class="sr-only" for="pname">Player name</label>
          <input class="slot" id="pname" type="text" placeholder="Add a player" autocomplete="off" spellcheck="false">
          <button type="button" class="key key-add" id="add-btn">
            <span class="led" aria-hidden="true"></span>
            <span class="key-label">Add</span>
          </button>
        </div>
        <p class="errline" id="err" role="status"></p>

        <div class="stepper" role="group" aria-labelledby="spies-label">
          <span class="vinyl" id="spies-label">Spies</span>
          <button type="button" class="step-btn" id="spy-minus" aria-label="Fewer spies">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <span class="step-value"><span class="seg" id="spy-count" data-seg="1" style="--h:32px"></span></span>
          <button type="button" class="step-btn" id="spy-plus" aria-label="More spies">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3v12M3 9h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="rosterhead">
          <span class="vinyl">Players</span>
          <span class="seg" id="roster-count" data-seg="6 / 12" style="--h:24px"></span>
        </div>
        <ul class="roster" id="roster"></ul>

        <p class="hintline" id="phint"></p>
        <div class="keys">
          <button type="button" class="key key-primary on" id="start-btn">
            <span class="led" aria-hidden="true"></span>
            <span class="key-label">Start game</span>
          </button>
          <button type="button" class="key key-ghost"><span class="key-label">Back</span></button>
        </div>
      </div>
    </section>
    <figcaption>Players</figcaption>
  </figure>

  <!-- ========================== HANDOFF =========================== -->
  <figure>
    <section class="phone" data-screen="handoff">
      <div class="screen">
        <p class="cue">
          <span class="sr-only">Player 3 of 6</span>
          <span class="cue-vis" aria-hidden="true" style="display:flex;align-items:center;gap:8px">
            <span class="vinyl vinyl-sm">Player</span>
            <span class="seg" data-seg="3" style="--h:15px"></span>
            <span class="vinyl vinyl-sm">of</span>
            <span class="seg" data-seg="6" style="--h:15px"></span>
          </span>
        </p>
        <div class="stage">
          <div class="panel panel-msg">
            <p class="bigword">Pass the phone to Priya</p>
          </div>
        </div>
        <div class="keys handoff-keys">
          <button type="button" class="key key-primary on">
            <span class="led" aria-hidden="true"></span>
            <span class="key-label">I'm Priya</span>
          </button>
        </div>
      </div>
    </section>
    <figcaption>Handoff</figcaption>
  </figure>

  <!-- ============================ CARD ============================ -->
  <figure>
    <div class="rolebar" id="rolebar">
      <span>Role</span>
      <button type="button" data-role="civilian" aria-pressed="true">Civilian</button>
      <button type="button" data-role="spy" aria-pressed="false">Spy</button>
    </div>
    <section class="phone" data-screen="card">
      <div class="screen">
        <p class="cue">
          <span class="sr-only">Player 3 of 6</span>
          <span class="cue-vis" aria-hidden="true" style="display:flex;align-items:center;gap:8px">
            <span class="vinyl vinyl-sm">Player</span>
            <span class="seg" data-seg="3" style="--h:15px"></span>
            <span class="vinyl vinyl-sm">of</span>
            <span class="seg" data-seg="6" style="--h:15px"></span>
          </span>
        </p>

        <div class="card-wrap">
          <button type="button" class="cardbtn" id="card" data-face="back" aria-label="Priya's card &#8212; tap to reveal">
            <span class="card-back" id="face-back">
              <span class="seg" id="ghostrow" aria-hidden="true" style="--h:46px"></span>
              <span class="card-name">Priya</span>
              <span class="card-cta">Tap to reveal</span>
            </span>
            <span class="card-face" id="face-civ" hidden>
              <span class="vinyl">Your word</span>
              <span class="word">Hot-air balloon</span>
            </span>
            <span class="card-face" id="face-spy" hidden>
              <span class="alarm" aria-hidden="true"></span>
              <span class="spy-title">You are the spy</span>
              <span class="word word-red">Hint: Slow</span>
            </span>
          </button>
        </div>

        <p class="cardhint" id="cardhint">Tap to reveal</p>
        <div class="keys">
          <button type="button" class="key key-primary" id="gotit" disabled>
            <span class="led" aria-hidden="true"></span>
            <span class="key-label">Got it</span>
          </button>
        </div>
      </div>
    </section>
    <figcaption>Card</figcaption>
  </figure>

  <!-- ========================= DISCUSSION ========================= -->
  <figure>
    <section class="phone" data-screen="discussion">
      <div class="screen">
        <div class="head">
          <h1 class="title">Discussion</h1>
        </div>
        <div class="stage-col">
          <div class="panel clockpanel">
            <span class="vinyl" id="timer-label">Time left</span>
            <span class="seg" id="clock" data-seg="03:47" style="--h:94px"></span>
          </div>
          <p class="disc-hint">Take turns describing the word. Find the spy.</p>
        </div>
        <div class="keys">
          <button type="button" class="key key-primary on" id="pause">
            <span class="led" aria-hidden="true"></span>
            <span class="key-label">Pause</span>
          </button>
          <button type="button" class="key key-ghost" id="endround"><span class="key-label">End round</span></button>
        </div>
      </div>
    </section>
    <figcaption>Discussion</figcaption>
  </figure>

  <!-- =========================== ENDED ============================ -->
  <figure>
    <section class="phone" data-screen="ended">
      <div class="screen">
        <div class="ended-mid">
          <h1 class="ended-title">Time's up</h1>
          <div class="panel panel-clock">
            <span class="seg" data-seg="00:00" data-tone="standby" style="--h:40px"></span>
          </div>
          <p class="ended-sub">Decide together who the spy was.</p>
        </div>
        <div class="keys">
          <button type="button" class="key key-primary on">
            <span class="led" aria-hidden="true"></span>
            <span class="key-label">Play again</span>
          </button>
          <button type="button" class="key key-ghost"><span class="key-label">Exit</span></button>
        </div>
      </div>
    </section>
    <figcaption>Ended</figcaption>
  </figure>

</div>

<script>
(function () {
  'use strict'

  var VERSION = 'v3'
  var SEG_I = '<i class="sa"></i><i class="sb"></i><i class="sc"></i><i class="sd"></i><i class="se"></i><i class="sf"></i><i class="sg"></i>'
  var $ = function (sel, root) { return (root || document).querySelector(sel) }
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)) }

  /* ---------------- seven-segment renderer ---------------- */
  function mountSeg(host) {
    if (host.dataset.mounted) return
    host.innerHTML = '<span class="seg-cells" aria-hidden="true"></span><span class="sr-only"></span>'
    host.dataset.mounted = '1'
    paint(host, host.dataset.seg || '')
  }
  function paint(host, value) {
    var s = String(value)
    var html = ''
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i)
      if (ch === ':') html += '<span class="seg-colon"><i></i><i></i></span>'
      else if (ch === '/') html += '<span class="seg-slash"></span>'
      else if (ch === ' ') html += '<span class="seg-space"></span>'
      else html += '<span class="seg-digit" data-d="' + ch + '">' + SEG_I + '</span>'
    }
    host.firstElementChild.innerHTML = html
    host.lastElementChild.textContent = s
    host.dataset.seg = s
  }
  $$('.seg').forEach(mountSeg)

  /* the face-down card is an unlit board: seven cells, every segment a ghost */
  var ghostrow = $('#ghostrow')
  var gh = ''
  for (var g = 0; g < 7; g++) gh += '<span class="seg-digit">' + SEG_I + '</span>'
  ghostrow.firstElementChild.innerHTML = gh

  /* ---------------- demo data ---------------- */
  var DEMO_TOPICS = [
    { id: 'locations', name: 'Locations', on: true },
    { id: 'professions', name: 'Professions', on: false },
    { id: 'food', name: 'Food & Drink', on: true },
    { id: 'entertainment', name: 'Entertainment', on: false },
    { id: 'travel', name: 'Travel', on: true }
  ]
  var DEMO_PLAYERS = ['Mia', 'Theo', 'Priya', 'Jonas', 'Aiko', 'Sam']
  var START_SECONDS = 227 /* 03:47 */
  var MAX_PLAYERS = 12

  var topics, players, spyCount

  /* ---------------- topics ---------------- */
  var platesEl = $('#plates')
  var topicCountEl = $('#topic-count')

  function buildPlates() {
    platesEl.innerHTML = ''
    topics.forEach(function (t) {
      var li = document.createElement('li')
      var b = document.createElement('button')
      b.type = 'button'
      b.className = 'plate'
      b.dataset.topic = t.id
      b.innerHTML = '<span class="led" aria-hidden="true"></span><span class="plate-label"></span>'
      $('.plate-label', b).textContent = t.name
      b.addEventListener('click', function () { toggleTopic(t.id) })
      li.appendChild(b)
      platesEl.appendChild(li)
    })
  }
  function includedCount() {
    return topics.filter(function (t) { return t.on }).length
  }
  function renderTopics() {
    var n = includedCount()
    paint(topicCountEl, n + ' / ' + topics.length)
    topics.forEach(function (t) {
      var b = platesEl.querySelector('[data-topic="' + t.id + '"]')
      b.setAttribute('aria-pressed', t.on ? 'true' : 'false')
      b.disabled = t.on && n === 1
    })
  }
  function toggleTopic(id) {
    var t = topics.filter(function (x) { return x.id === id })[0]
    if (!t) return
    if (t.on && includedCount() === 1) return
    t.on = !t.on
    renderTopics()
  }

  /* ---------------- players ---------------- */
  var rosterEl = $('#roster')
  var rosterCountEl = $('#roster-count')
  var spyCountEl = $('#spy-count')
  var stepperEl = $('.stepper')
  var hintEl = $('#phint')
  var errEl = $('#err')
  var input = $('#pname')
  var startBtn = $('#start-btn')
  var minusBtn = $('#spy-minus')
  var plusBtn = $('#spy-plus')

  function rmIcon() {
    return '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">' +
      '<path d="M4.5 4.5l9 9M13.5 4.5l-9 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
  }

  function renderPlayers() {
    rosterEl.innerHTML = ''
    if (players.length === 0) {
      var li0 = document.createElement('li')
      li0.style.borderBottom = 'none'
      li0.innerHTML = '<span class="empty">No players yet.</span>'
      rosterEl.appendChild(li0)
    }
    players.forEach(function (name, i) {
      var li = document.createElement('li')
      var idx = document.createElement('span')
      idx.className = 'idx'
      idx.setAttribute('aria-hidden', 'true')
      var seg = document.createElement('span')
      seg.className = 'seg'
      seg.setAttribute('style', '--h:16px')
      seg.dataset.seg = String(i + 1)
      idx.appendChild(seg)

      var nm = document.createElement('span')
      nm.className = 'pname'
      nm.textContent = name

      var rm = document.createElement('button')
      rm.type = 'button'
      rm.className = 'rm'
      rm.setAttribute('aria-label', 'Remove ' + name)
      rm.innerHTML = rmIcon()
      rm.addEventListener('click', function () { removePlayer(name) })

      li.appendChild(idx); li.appendChild(nm); li.appendChild(rm)
      rosterEl.appendChild(li)
      mountSeg(seg)
    })

    paint(rosterCountEl, players.length + ' / ' + MAX_PLAYERS)

    if (players.length >= 3) {
      hintEl.textContent = spyCount + ' of you will secretly be the ' + (spyCount === 1 ? 'spy.' : 'spies.')
    } else {
      var need = 3 - players.length
      hintEl.textContent = 'Add ' + need + ' more player' + (need === 1 ? '' : 's') + ' to start.'
    }

    startBtn.disabled = players.length < 3
    startBtn.classList.toggle('on', players.length >= 3)
    renderSpyCount()
  }

  function renderSpyCount() {
    paint(spyCountEl, String(spyCount))
    minusBtn.disabled = spyCount <= 1
    plusBtn.disabled = spyCount >= Math.max(1, players.length)
  }

  function setSpyCount(n) {
    var max = Math.max(1, players.length)
    var next = Math.min(max, Math.max(1, n))
    if (next === spyCount) return
    spyCount = next
    renderSpyCount()
    stepperEl.classList.remove('blink-set')
    void stepperEl.offsetWidth
    stepperEl.classList.add('blink-set')
    renderPlayers()
  }
  stepperEl.addEventListener('animationend', function () { stepperEl.classList.remove('blink-set') })

  function removePlayer(name) {
    players = players.filter(function (p) { return p !== name })
    if (spyCount > Math.max(1, players.length)) spyCount = Math.max(1, players.length)
    errEl.textContent = ''
    renderPlayers()
  }

  function addPlayer() {
    var raw = input.value.trim()
    if (!raw) { errEl.textContent = 'Type a name first.'; return }
    if (players.length >= MAX_PLAYERS) { errEl.textContent = "That's the maximum of 12 players."; return }
    var dupe = players.some(function (p) { return p.toLowerCase() === raw.toLowerCase() })
    if (dupe) { errEl.textContent = 'Someone already has that name.'; return }
    players.push(raw)
    input.value = ''
    errEl.textContent = ''
    renderPlayers()
    rosterEl.scrollTop = rosterEl.scrollHeight
  }

  var addBtn = $('#add-btn')
  addBtn.addEventListener('click', addPlayer)
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addPlayer() } })
  input.addEventListener('input', function () {
    if (errEl.textContent) errEl.textContent = ''
    addBtn.classList.toggle('on', input.value.trim().length > 0)
  })
  minusBtn.addEventListener('click', function () { setSpyCount(spyCount - 1) })
  plusBtn.addEventListener('click', function () { setSpyCount(spyCount + 1) })

  /* ---------------- card ---------------- */
  var cardEl = $('#card')
  var faceBack = $('#face-back')
  var faceCiv = $('#face-civ')
  var faceSpy = $('#face-spy')
  var cardHint = $('#cardhint')
  var gotIt = $('#gotit')
  var role = 'civilian'
  var revealed = false
  var gotItTimer = null

  function renderCard() {
    faceBack.hidden = revealed
    faceCiv.hidden = !(revealed && role === 'civilian')
    faceSpy.hidden = !(revealed && role === 'spy')
    cardEl.dataset.face = revealed ? role : 'back'
    if (revealed) {
      cardEl.removeAttribute('aria-label')
    } else {
      cardEl.setAttribute('aria-label', "Priya's card — tap to reveal")
    }
    cardHint.textContent = revealed ? 'Keep it to yourself.' : 'Tap to reveal'
    gotIt.disabled = !revealed
    gotIt.classList.toggle('on', revealed)
  }
  function faceDown() {
    revealed = false
    renderCard()
  }
  cardEl.addEventListener('click', function () {
    if (revealed) return
    revealed = true
    renderCard()
  })
  gotIt.addEventListener('click', function () {
    if (!revealed) return
    if (gotItTimer) clearTimeout(gotItTimer)
    gotItTimer = setTimeout(faceDown, 600)
  })

  function setRole(r) {
    if (r !== 'civilian' && r !== 'spy') return
    if (revealed) faceDown()
    role = r
    $$('#rolebar button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.role === role ? 'true' : 'false')
    })
    renderCard()
  }
  $$('#rolebar button').forEach(function (b) {
    b.addEventListener('click', function () { setRole(b.dataset.role) })
  })

  /* ---------------- clock ---------------- */
  var clockEl = $('#clock')
  var timerLabel = $('#timer-label')
  var pauseBtn = $('#pause')
  var endBtn = $('#endround')
  var remaining = START_SECONDS
  var running = true
  var frozen = false
  var deadline = Date.now() + START_SECONDS * 1000

  function mmss(sec) {
    var m = Math.floor(sec / 60), s = sec % 60
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s
  }
  function renderClock() {
    paint(clockEl, mmss(remaining))
    timerLabel.textContent = running ? 'Time left' : 'Paused'
    $('.key-label', pauseBtn).textContent = running ? 'Pause' : 'Resume'
    pauseBtn.classList.toggle('on', running)
    pauseBtn.disabled = frozen
    endBtn.disabled = frozen
  }
  function tick() {
    if (running) {
      var left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000))
      if (left !== remaining) {
        remaining = left
        if (remaining === 0) { running = false; frozen = true }
        renderClock()
      }
    }
  }
  setInterval(tick, 200)

  pauseBtn.addEventListener('click', function () {
    if (frozen) return
    if (running) {
      remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000))
      running = false
    } else {
      deadline = Date.now() + remaining * 1000
      running = true
    }
    renderClock()
  })
  endBtn.addEventListener('click', function () {
    if (frozen) return
    remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000))
    running = false
    frozen = true
    renderClock()
  })

  /* ---------------- reset ---------------- */
  function reset() {
    topics = DEMO_TOPICS.map(function (t) { return { id: t.id, name: t.name, on: t.on } })
    players = DEMO_PLAYERS.slice()
    spyCount = 1
    buildPlates()
    renderTopics()
    errEl.textContent = ''
    input.value = ''
    addBtn.classList.remove('on')
    renderPlayers()
    revealed = false
    renderCard()
    remaining = START_SECONDS
    running = true
    frozen = false
    deadline = Date.now() + START_SECONDS * 1000
    renderClock()
    rosterEl.scrollTop = 0
  }

  /* ---------------- display modes ---------------- */
  var SCREENS = ['home', 'topics', 'players', 'handoff', 'card', 'discussion', 'ended']
  function show(screen) {
    if (screen === 'all' || SCREENS.indexOf(screen) === -1) {
      document.documentElement.dataset.mode = 'strip'
      document.body.dataset.mode = 'strip'
      $$('figure').forEach(function (f) { f.hidden = false })
      return
    }
    document.documentElement.dataset.mode = 'single'
    document.body.dataset.mode = 'single'
    $$('figure').forEach(function (f) {
      var p = $('.phone', f)
      f.hidden = !p || p.dataset.screen !== screen
    })
  }

  function applyHash() {
    var h = (location.hash || '').replace(/^#/, '')
    if (!h) return
    var parts = h.split(/[&;]/)
    var wanted = null
    parts.forEach(function (p) {
      var kv = p.split('=')
      var k = decodeURIComponent(kv[0] || '').trim()
      var v = decodeURIComponent(kv[1] || '').trim()
      if (k === 'screen') wanted = v
      if (k === 'role') setRole(v)
    })
    if (wanted) show(wanted)
  }

  window.addEventListener('message', function (e) {
    var d = e.data
    if (!d || typeof d !== 'object') return
    if (d.type === 'spy:show') show(d.screen)
    else if (d.type === 'spy:role') setRole(d.role)
    else if (d.type === 'spy:reset') reset()
  })
  window.addEventListener('hashchange', applyHash)

  /* ---------------- boot ---------------- */
  reset()
  applyHash()

  function ready() {
    try { window.parent.postMessage({ type: 'spy:ready', version: VERSION }, '*') } catch (err) { /* no parent */ }
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ready)
  else window.addEventListener('load', ready)
})()
</script>
</body>
